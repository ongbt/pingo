<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Join Bingo Game</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f47b25",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221710",
                        "neutral-light": "#e6dfdb",
                        "neutral-muted": "#f0edea"
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
        /* Hide spin buttons for number inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col bg-gradient-to-b from-blue-50 to-white dark:from-slate-900 dark:to-background-dark"><div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<!-- Dynamic Rays -->
<div class="absolute inset-0 bg-[#87CEFA] dark:bg-[#1a3a5a] opacity-30"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[200%] h-[200%] opacity-20">
<div class="w-full h-full" style="background: repeating-conic-gradient(from 0deg, transparent 0deg 15deg, white 15deg 30deg);"></div>
</div>
<!-- Floating Bingo Balls -->
<div class="absolute top-10 -left-6 size-24 rounded-full bg-primary/20 border-4 border-white/30 flex items-center justify-center text-white/40 font-bold text-2xl rotate-12">B</div>
<div class="absolute bottom-20 -right-8 size-32 rounded-full bg-green-400/20 border-4 border-white/30 flex items-center justify-center text-white/40 font-bold text-3xl -rotate-12">29</div>
<div class="absolute top-1/4 -right-4 size-16 rounded-full bg-blue-400/20 border-4 border-white/30 flex items-center justify-center text-white/40 font-bold text-lg rotate-45">30</div>
<!-- Decorative Stars -->
<span class="material-symbols-outlined absolute top-20 right-10 text-yellow-400/40 text-4xl">star</span>
<span class="material-symbols-outlined absolute bottom-40 left-10 text-yellow-400/40 text-3xl">star</span>
<span class="material-symbols-outlined absolute top-1/2 right-4 text-yellow-400/40 text-5xl">star</span>
</div>
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between px-4 py-4 bg-background-light dark:bg-background-dark relative">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-neutral-muted dark:hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Join Game</h1>
<div class="size-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 flex flex-col items-center px-6 pt-8 pb-4 max-w-md mx-auto w-full relative">
<!-- Content Header -->
<div class="text-center mb-10">
<h2 class="text-3xl font-extrabold tracking-tight mb-3">Enter Room Code</h2>
<p class="text-slate-600 dark:text-slate-400 text-base leading-relaxed">
                Ask the host for the 6-digit code to join the bingo lobby.
            </p>
</div>
<!-- 6-Digit Input Display -->
<div class="flex justify-between w-full gap-2 mb-10">
<!-- Active/Filled Digit -->
<div class="size-12 sm:size-14 rounded-full bg-primary/10 border-2 border-primary flex items-center justify-center">
<span class="text-xl font-bold text-primary">8</span>
</div>
<!-- Empty Digits -->
<div class="size-12 sm:size-14 rounded-full bg-neutral-muted dark:bg-white/5 border-2 border-transparent flex items-center justify-center">
<div class="size-2 rounded-full bg-slate-300 dark:bg-slate-600"></div>
</div>
<div class="size-12 sm:size-14 rounded-full bg-neutral-muted dark:bg-white/5 border-2 border-transparent flex items-center justify-center">
<div class="size-2 rounded-full bg-slate-300 dark:bg-slate-600"></div>
</div>
<div class="size-12 sm:size-14 rounded-full bg-neutral-muted dark:bg-white/5 border-2 border-transparent flex items-center justify-center">
<div class="size-2 rounded-full bg-slate-300 dark:bg-slate-600"></div>
</div>
<div class="size-12 sm:size-14 rounded-full bg-neutral-muted dark:bg-white/5 border-2 border-transparent flex items-center justify-center">
<div class="size-2 rounded-full bg-slate-300 dark:bg-slate-600"></div>
</div>
<div class="size-12 sm:size-14 rounded-full bg-neutral-muted dark:bg-white/5 border-2 border-transparent flex items-center justify-center">
<div class="size-2 rounded-full bg-slate-300 dark:bg-slate-600"></div>
</div>
</div>
<!-- Join Lobby Button -->
<button class="w-full bg-primary text-white font-bold py-4 rounded-full text-lg tracking-wide hover:brightness-110 active:scale-[0.98] transition-all mb-auto">
            Join Lobby
        </button>
<!-- Numeric Keypad -->
<div class="w-full grid grid-cols-3 gap-4 mt-8">
<button class="h-16 flex items-center justify-center rounded-full bg-neutral-muted dark:bg-white/5 text-2xl font-bold hover:bg-neutral-light dark:hover:bg-white/10 active:scale-95 transition-all">1</button>
<button class="h-16 flex items-center justify-center rounded-full bg-neutral-muted dark:bg-white/5 text-2xl font-bold hover:bg-neutral-light dark:hover:bg-white/10 active:scale-95 transition-all">2</button>
<button class="h-16 flex items-center justify-center rounded-full bg-neutral-muted dark:bg-white/5 text-2xl font-bold hover:bg-neutral-light dark:hover:bg-white/10 active:scale-95 transition-all">3</button>
<button class="h-16 flex items-center justify-center rounded-full bg-neutral-muted dark:bg-white/5 text-2xl font-bold hover:bg-neutral-light dark:hover:bg-white/10 active:scale-95 transition-all">4</button>
<button class="h-16 flex items-center justify-center rounded-full bg-neutral-muted dark:bg-white/5 text-2xl font-bold hover:bg-neutral-light dark:hover:bg-white/10 active:scale-95 transition-all">5</button>
<button class="h-16 flex items-center justify-center rounded-full bg-neutral-muted dark:bg-white/5 text-2xl font-bold hover:bg-neutral-light dark:hover:bg-white/10 active:scale-95 transition-all">6</button>
<button class="h-16 flex items-center justify-center rounded-full bg-neutral-muted dark:bg-white/5 text-2xl font-bold hover:bg-neutral-light dark:hover:bg-white/10 active:scale-95 transition-all">7</button>
<button class="h-16 flex items-center justify-center rounded-full bg-neutral-muted dark:bg-white/5 text-2xl font-bold hover:bg-neutral-light dark:hover:bg-white/10 active:scale-95 transition-all">8</button>
<button class="h-16 flex items-center justify-center rounded-full bg-neutral-muted dark:bg-white/5 text-2xl font-bold hover:bg-neutral-light dark:hover:bg-white/10 active:scale-95 transition-all">9</button>
<div class="h-16 flex items-center justify-center"></div>
<button class="h-16 flex items-center justify-center rounded-full bg-neutral-muted dark:bg-white/5 text-2xl font-bold hover:bg-neutral-light dark:hover:bg-white/10 active:scale-95 transition-all">0</button>
<button class="h-16 flex items-center justify-center rounded-full bg-primary/10 text-primary hover:bg-primary/20 active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl">backspace</span>
</button>
</div>
</main>
<!-- Bottom Indicator -->
<footer class="flex justify-center p-2">
<div class="w-32 h-1 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
</footer>
</body></html>
