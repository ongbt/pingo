<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Pingo - Multiplayer Bingo Experience</title>
    <meta name="title" content="Pingo - Multiplayer Bingo Experience" />
    <meta
      name="description"
      content="The ultimate multiplayer bingo game for corporate townhalls, family nights, and parties. Create custom sheets and play with friends in real-time."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pingo.ongbt.dev/" />
    <meta property="og:title" content="Pingo - Multiplayer Bingo Experience" />
    <meta
      property="og:description"
      content="Host your own room or join friends for a high-energy bingo night anytime, anywhere. Custom sheets, real-time sync, and ultimate fun."
    />
    <meta property="og:image" content="https://pingo.ongbt.dev/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://pingo.ongbt.dev/" />
    <meta
      property="twitter:title"
      content="Pingo - Multiplayer Bingo Experience"
    />
    <meta
      property="twitter:description"
      content="Host your own room or join friends for a high-energy bingo night anytime, anywhere."
    />
    <meta
      property="twitter:image"
      content="https://pingo.ongbt.dev/og-image.png"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pingo",
        "url": "https://pingo.ongbt.dev/",
        "description": "Multiplayer bingo game for groups and parties.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web"
      }
    </script>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
